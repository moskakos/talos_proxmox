---
# Default variables for talos_proxmox role
# All sensitive and environment-specific data should be overridden in group_vars/host_vars or via extra_vars

talos_proxmox_proxmox_server: "pve-01.example.com"
talos_proxmox_proxmox_port: 8006
# Optional PEM CA bundle on the host executing the modules, e.g. /polku/pki-root-ca.pem.
# Empty uses the modules' default CA trust.
talos_proxmox_proxmox_ca_path: ""
talos_proxmox_proxmox_url: "https://{{ talos_proxmox_proxmox_server }}:{{ talos_proxmox_proxmox_port }}"
talos_proxmox_proxmox_api_url: "{{ talos_proxmox_proxmox_url }}/api2/json"
talos_proxmox_proxmox_api_user: "talos@pve"
talos_proxmox_proxmox_api_token_id: "token"
talos_proxmox_proxmox_api_token_secret: "secret"

talos_proxmox_proxmox_node: "pve-01"
talos_proxmox_proxmox_storage: "truenas-01-isos"
talos_proxmox_proxmox_vm_storage: "nvme"
talos_proxmox_proxmox_storage_url: "{{ talos_proxmox_proxmox_api_url }}/nodes/{{ talos_proxmox_proxmox_node }}/storage/{{ talos_proxmox_proxmox_storage }}"

# Optional first VMID; assigns consecutive IDs to masters, then workers.
# null lets Proxmox choose the next available ID for each VM.
talos_proxmox_vmid_starting_number:

talos_proxmox_talos_version: "v1.14.5"
# Additional official extensions: https://github.com/siderolabs/extensions#extension-catalog
# qemu-guest-agent is always included; Proxmox uses it to discover VM IP addresses.
# Longhorn requires these extensions (also added automatically by enable_longhorn_support):
# talos_proxmox_talos_extensions:
#   - siderolabs/iscsi-tools
#   - siderolabs/util-linux-tools
talos_proxmox_talos_extensions: []

# Automatically includes siderolabs/iscsi-tools and siderolabs/util-linux-tools;
# no need to list them in talos_proxmox_talos_extensions when this is true.
# Also applies existing kernel/sysctl prerequisites; does not install Longhorn.
talos_proxmox_enable_longhorn_support: false

talos_proxmox_talos_installation_disk_path: "/dev/sda" # Disk inside VM to install Talos onto (e.g. /dev/sda)
talos_proxmox_talos_cpu_type: "host"

# Additional Talos API certificate SANs on control-plane nodes, e.g. an HAProxy endpoint.
# Empty disables this optional configuration; these are not Kubernetes API SANs.
talos_proxmox_talos_api_cert_sans: []

talos_proxmox_cluster_name: "kube.example.com"
talos_proxmox_cluster_shared_ip: 192.168.1.20
talos_proxmox_mgmt_network: "192.168.1.0/24"
talos_proxmox_mgmt_gateway: "192.168.1.254"

# Enable VLAN interfaces on Talos nodes and select them as Cilium devices. If false, VM interfaces use access ports.
talos_proxmox_enable_vlans: false
# Set this to false if the vms interface should not have any vlan tag. It must be set if talos_proxmox_enable_vlans is true.
# If talos_proxmox_enable_vlans is true the talos_proxmox_mgmt_vlan_id is used for a mgmt subinterface inside the vm,
# else it is used on proxmox for the VM interface vlan id
talos_proxmox_mgmt_vlan_id: 12

# Use cilium instead of flannel as CNI. If you intend to use VLANs this must be true.
talos_proxmox_install_cilium: "{{ talos_proxmox_enable_vlans | bool }}"

# Cilium version to install (must be a valid cilium helm chart version)
talos_proxmox_cilium_version: "1.18.2"

# Install Gateway API for cilium (requires cilium to be installed)
talos_proxmox_enable_gateway_api: "{{ talos_proxmox_install_cilium | bool }}"

# Gateway API CRD version to install (use version supported by cilium, e.g. v1.2.0 for cilium 1.18.x)
talos_proxmox_gateway_api_crds_version: "v1.2.0"

# Gateway API CRD source base url
talos_proxmox_gateway_api_crds_base_url: "https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/{{ talos_proxmox_gateway_api_crds_version }}/config/crd"

# Gateway API CRDs to install (if empty no CRDs will be installed)
talos_proxmox_gateway_api_crds:
  - type: standard
    name: gateways
  - type: standard
    name: gatewayclasses
  - type: standard
    name: httproutes
  - type: standard
    name: referencegrants
  - type: standard
    name: grpcroutes
  - type: experimental
    name: tlsroutes

# Enable Wireguard encryption for Cilium (requires cilium to be installed)
talos_proxmox_enable_cilium_wireguard: "{{ talos_proxmox_install_cilium | bool }}"

# Enable node-to-node encryption for Cilium (requires cilium and wireguard to be enabled)
# False means only pod to pod traffic on different nodes is encrypted
talos_proxmox_enable_cilium_node_encryption: false

talos_proxmox_k8s_vmbr: "vmbr0"

talos_proxmox_masters:
  - name: talos-01
    ip: 192.168.1.11
    cores: 2
    memory: 4096
    disk: 64
  - name: talos-02
    ip: 192.168.1.12
    cores: 2
    memory: 4096
    disk: 64
  - name: talos-03
    ip: 192.168.1.13
    cores: 2
    memory: 4096
    disk: 64

talos_proxmox_workers: []

# Base interface for VLANs (e.g. eth0, ens18, ...)
talos_proxmox_vlan_base_interface: "eth0"

# When true, the control-plane taint and the node.kubernetes.io/exclude-from-external-load-balancers label are
# removed, so masters can run workloads and load balancers such as MetalLB (L2) can announce addresses from them.
# Defaults to true only when no workers are defined.
talos_proxmox_schedule_on_masters: "{{ (talos_proxmox_workers | length == 0) | bool }}"

# VLANs for Cilium (for later service exposure)
talos_proxmox_vlan_config:
  - name: vlan1 # only use lowercase alphanumeric characters and -
    vlan_id: 101
  - name: vlan2
    vlan_id: 102

# DNS nameservers used in rendered Talos machine configs. Can be overridden in inventory.
talos_proxmox_nameservers:
  - 192.168.1.1
  - 192.168.1.2

# Search domains appended to short hostnames through ResolverConfig. Empty means not set.
# Example: ["example.com"]
talos_proxmox_search_domains:
  - example.com
  - internal.example.com

# Optional host DNS settings in ResolverConfig. Empty means not set.
# Example: { enabled: true, forwardKubeDNSToHost: true, resolveMemberNames: true }
# or empty: {}
talos_proxmox_host_dns: { enabled: true, forwardKubeDNSToHost: true, resolveMemberNames: true }

talos_proxmox_timeservers:
  - time.example.com

# Disable IPv6 if not using vlans. If using vlans using IPv6 is recommended so that cilium marks all vlan interfaces as selected.
talos_proxmox_disable_ipv6: "{{ talos_proxmox_enable_vlans | ternary(false, true) | bool }}"

# All kuberentes resources defined in talos_proxmox_static_resources will be applied after cluster creation
# This can be used to pre create namespaces, secrets and so on
# The static resources are applied in order using the kubernetes.core.k8s module
# The following keywords are supported for each item in the list:
#   - definition: A full kubernetes resource definition as a dictionary
#   - src: A path to a YAML file containing one or more Kubernetes resources; use either src or definition
#   - template: Boolean, default false. If true, src is a Jinja2 template on the Ansible controller
#   - name: A name for the resource (overwritten by definition or src metadata.name if present)
#   - namespace: The namespace to apply the resource to (if not defined in the resource)
#   - wait: If true the task will wait for the resource to be ready (default: false)
#   - wait_condition: The condition to wait for (default: "Available" for Deployments, "Ready" for others)
#   - wait_timeout: Time in seconds to wait for the resource to be ready (default: 300)
#   - wait_sleep: Time in seconds to wait between checks (default: 6)
#   - state: The desired state of the resource (default: present)
#   - force: If true the resource will be replaced if it already exists (default: false)
talos_proxmox_static_resources: []
  # - definition:
  #     apiVersion: v1
  #     kind: Namespace
  #     metadata:
  #       name: testing
  # - definition:
  #     apiVersion: apps/v1
  #     kind: Deployment
  #     metadata:
  #       name: example
  #       namespace: testing
  #     spec:
  #       paused: True
  #   wait: true
  #   wait_condition:
  #     type: Progressing
  #     status: Unknown
  #     reason: DeploymentPaused
