---
# Provision VMs on Proxmox for masters and workers

- name: Validate and check requested VM IDs
  ansible.builtin.import_tasks: validate_vmids.yml
  when: talos_proxmox_vmid_starting_number is not none

- name: Validate Proxmox ISO download authentication
  ansible.builtin.assert:
    that:
      - talos_proxmox_proxmox_api_token_id is string
      - talos_proxmox_proxmox_api_token_id | length > 0
      - talos_proxmox_proxmox_api_token_secret is string
      - talos_proxmox_proxmox_api_token_secret | length > 0
    fail_msg: "Set a non-empty Proxmox API token ID and secret before downloading the Talos ISO."
    quiet: true

- name: Check existing Talos ISOs in Proxmox storage
  ansible.builtin.uri:
    url: "{{ talos_proxmox_proxmox_storage_url }}/content"
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ talos_proxmox_proxmox_api_user }}!{{ talos_proxmox_proxmox_api_token_id }}={{ talos_proxmox_proxmox_api_token_secret }}"
    validate_certs: true
    ca_path: "{{ talos_proxmox_proxmox_ca_path | default(omit, true) }}"
    return_content: true
  register: talos_proxmox_existing_iso_content

- name: Find the exact Talos ISO in storage
  ansible.builtin.set_fact:
    talos_proxmox_existing_isos: >-
      {{ talos_proxmox_existing_iso_content.json.data
         | selectattr('volid', 'equalto', talos_proxmox_proxmox_storage ~ ':iso/' ~ talos_proxmox_talos_iso_filename) | list }}

- name: Require an unambiguous non-empty existing Talos ISO
  ansible.builtin.assert:
    that:
      - talos_proxmox_existing_isos | length == 1
      - talos_proxmox_existing_isos[0].size is defined
      - talos_proxmox_existing_isos[0].size is number
      - talos_proxmox_existing_isos[0].size > 0
    fail_msg: >-
      Existing Talos ISO {{ talos_proxmox_talos_iso_filename }} is ambiguous or has an invalid or empty size.
      Inspect the file in Proxmox storage and remove it manually if a new download is needed.
      The role will not delete or overwrite it.
    quiet: true
  when: talos_proxmox_existing_isos | length > 0

- name: Download Talos ISO to Proxmox storage
  ansible.builtin.uri:
    url: "{{ talos_proxmox_proxmox_storage_url }}/download-url"
    method: POST
    headers:
      Authorization: "PVEAPIToken={{ talos_proxmox_proxmox_api_user }}!{{ talos_proxmox_proxmox_api_token_id }}={{ talos_proxmox_proxmox_api_token_secret }}"
    body_format: form-urlencoded
    body:
      content: iso
      filename: "{{ talos_proxmox_talos_iso_filename }}"
      url: "{{ talos_proxmox_talos_iso_download_url }}"
    validate_certs: true
    ca_path: "{{ talos_proxmox_proxmox_ca_path | default(omit, true) }}"
    return_content: true
  register: talos_proxmox_iso_download
  when: talos_proxmox_existing_isos | length == 0

- name: Validate the Proxmox ISO download task ID
  ansible.builtin.assert:
    that:
      - talos_proxmox_iso_download.json.data is defined
      - talos_proxmox_iso_download.json.data is string
      - talos_proxmox_iso_download.json.data is match('^UPID:')
    fail_msg: "Proxmox did not return a valid UPID for the Talos ISO download."
    quiet: true
  when: talos_proxmox_existing_isos | length == 0

- name: Wait for the Proxmox ISO download task to finish
  ansible.builtin.uri:
    url: "{{ talos_proxmox_proxmox_api_url }}/nodes/{{ talos_proxmox_proxmox_node }}/tasks/{{ talos_proxmox_iso_download.json.data | urlencode }}/status"
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ talos_proxmox_proxmox_api_user }}!{{ talos_proxmox_proxmox_api_token_id }}={{ talos_proxmox_proxmox_api_token_secret }}"
    validate_certs: true
    ca_path: "{{ talos_proxmox_proxmox_ca_path | default(omit, true) }}"
    return_content: true
  register: talos_proxmox_iso_download_status
  until: talos_proxmox_iso_download_status is failed or (talos_proxmox_iso_download_status.json.data.status | default('')) == 'stopped'
  retries: 100
  delay: 6
  when: talos_proxmox_existing_isos | length == 0

- name: Verify the Proxmox ISO download succeeded
  ansible.builtin.assert:
    that:
      - talos_proxmox_iso_download_status.json.data.exitstatus | default('') == 'OK'
    fail_msg: >-
      Talos ISO download task {{ talos_proxmox_iso_download.json.data }} failed:
      {{ talos_proxmox_iso_download_status.json.data.exitstatus | default('No exit status returned') }}.
      Check the task log in Proxmox before retrying.
    quiet: true
  when: talos_proxmox_existing_isos | length == 0

- name: Get the completed ISO from Proxmox storage
  ansible.builtin.uri:
    url: "{{ talos_proxmox_proxmox_storage_url }}/content"
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ talos_proxmox_proxmox_api_user }}!{{ talos_proxmox_proxmox_api_token_id }}={{ talos_proxmox_proxmox_api_token_secret }}"
    validate_certs: true
    ca_path: "{{ talos_proxmox_proxmox_ca_path | default(omit, true) }}"
    return_content: true
  register: talos_proxmox_iso_content

- name: Verify the completed ISO exists and has a positive size
  ansible.builtin.assert:
    that:
      - talos_proxmox_matching_isos | length == 1
      - talos_proxmox_matching_isos[0].size is defined
      - talos_proxmox_matching_isos[0].size is number
      - talos_proxmox_matching_isos[0].size > 0
    fail_msg: "Talos ISO {{ talos_proxmox_talos_iso_filename }} is missing or has an invalid or empty size in Proxmox storage."
    quiet: true
  vars:
    talos_proxmox_matching_isos: >-
      {{ talos_proxmox_iso_content.json.data
         | selectattr('volid', 'equalto', talos_proxmox_proxmox_storage ~ ':iso/' ~ talos_proxmox_talos_iso_filename) | list }}

- name: Create talos VMs
  community.proxmox.proxmox_kvm:
    ca_path: "{{ talos_proxmox_proxmox_ca_path | default(omit, true) }}"
    api_user: "{{ talos_proxmox_proxmox_api_user }}"
    api_host: "{{ talos_proxmox_proxmox_server }}"
    api_port: "{{ talos_proxmox_proxmox_port }}"
    api_token_id: "{{ talos_proxmox_proxmox_api_token_id }}"
    api_token_secret: "{{ talos_proxmox_proxmox_api_token_secret }}"
    node: "{{ talos_proxmox_proxmox_node }}"
    name: "{{ item.name }}"
    vmid: "{{ (talos_proxmox_vmid_starting_number + talos_proxmox_vm_index) if talos_proxmox_vmid_starting_number is not none else omit }}"
    cores: "{{ item.cores }}"
    memory: "{{ item.memory }}"
    cpu: "{{ talos_proxmox_talos_cpu_type }}"
    net:
      net0: >-
        model=virtio,bridge={{ talos_proxmox_k8s_vmbr }},firewall=0{% if talos_proxmox_mgmt_vlan_id %}{{
        ',tag=' ~ talos_proxmox_mgmt_vlan_id }}{% endif %}
    ostype: l26
    scsihw: virtio-scsi-single
    onboot: true
    agent: true
    state: present
    scsi: >-
      {{ ({ 'scsi0': talos_proxmox_proxmox_vm_storage ~ ':' ~ item.disk ~ ',format=raw' })
         | combine(({ 'scsi1': talos_proxmox_proxmox_vm_storage ~ ':' ~ item.storage_disk ~ ',format=raw' })
                   if (item.storage_disk | default(0, true) | int) > 0 else {}) }}
    ide:
      ide2: "{{ talos_proxmox_proxmox_storage }}:iso/{{ talos_proxmox_talos_iso_filename }},media=cdrom"
  loop: "{{ talos_proxmox_masters + talos_proxmox_workers }}"
  loop_control:
    index_var: talos_proxmox_vm_index
    label: "{{ item.name }}"

- name: Recheck VM identities before starting
  ansible.builtin.import_tasks: validate_vmids.yml
  when: talos_proxmox_vmid_starting_number is not none

- name: Start talos VMs
  community.proxmox.proxmox_kvm:
    ca_path: "{{ talos_proxmox_proxmox_ca_path | default(omit, true) }}"
    api_user: "{{ talos_proxmox_proxmox_api_user }}"
    api_host: "{{ talos_proxmox_proxmox_server }}"
    api_port: "{{ talos_proxmox_proxmox_port }}"
    api_token_id: "{{ talos_proxmox_proxmox_api_token_id }}"
    api_token_secret: "{{ talos_proxmox_proxmox_api_token_secret }}"
    node: "{{ talos_proxmox_proxmox_node }}"
    name: "{{ item.name }}"
    vmid: "{{ (talos_proxmox_vmid_starting_number + talos_proxmox_vm_index) if talos_proxmox_vmid_starting_number is not none else omit }}"
    state: started
  register: talos_proxmox_vm_start
  until: talos_proxmox_vm_start is succeeded
  retries: 10
  delay: 3
  loop: "{{ talos_proxmox_masters + talos_proxmox_workers }}"
  loop_control:
    index_var: talos_proxmox_vm_index
    label: "{{ item.name }}"
