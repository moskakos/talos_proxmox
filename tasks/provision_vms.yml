---
# Provision VMs on Proxmox for masters and workers

- name: Download Talos ISO to Proxmox storage
  ansible.builtin.uri:
    url: "{{ talos_proxmox_proxmox_storage_url }}/download-url"
    method: POST
    headers:
      Authorization: "PVEAPIToken={{ talos_proxmox_proxmox_api_user }}!{{ talos_proxmox_proxmox_api_token_id }}={{ talos_proxmox_proxmox_api_token_secret }}"
    body_format: form-urlencoded
    body:
      content: iso
      filename: "talos-{{ talos_proxmox_talos_version }}-amd64.iso"
      url: "{{ talos_proxmox_talos_iso_download_url }}"
    validate_certs: no
    return_content: yes
  when: talos_proxmox_proxmox_api_token_id is defined and talos_proxmox_proxmox_api_token_secret is defined and (talos_proxmox_proxmox_api_token_id | length) > 0

- name: Wait for ISO to be available in Proxmox storage
  ansible.builtin.uri:
    url: "{{ talos_proxmox_proxmox_storage_url }}/content"
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ talos_proxmox_proxmox_api_user }}!{{ talos_proxmox_proxmox_api_token_id }}={{ talos_proxmox_proxmox_api_token_secret }}"
    validate_certs: no
    return_content: yes
  register: talos_proxmox_iso_content
  until: (talos_proxmox_proxmox_storage ~ ':iso/talos-' ~ talos_proxmox_talos_version ~ '-amd64.iso') in (talos_proxmox_iso_content.json.data | map(attribute='volid') | list)
  failed_when: false
  retries: 10
  delay: 6

- name: Create talos VMs
  community.proxmox.proxmox_kvm:
    api_user: "{{ talos_proxmox_proxmox_api_user }}"
    api_host: "{{ talos_proxmox_proxmox_server }}"
    api_port: "{{ talos_proxmox_proxmox_port }}"
    api_token_id: "{{ talos_proxmox_proxmox_api_token_id }}"
    api_token_secret: "{{ talos_proxmox_proxmox_api_token_secret }}"
    node: "{{ talos_proxmox_proxmox_node }}"
    name: "{{ item.name }}"
    cores: "{{ item.cores }}"
    memory: "{{ item.memory }}"
    cpu: "{{ talos_proxmox_talos_cpu_type}}"
    net:
      net0: "model=virtio,bridge={{ talos_proxmox_k8s_vmbr }},firewall=0{% if talos_proxmox_mgmt_vlan_id %}{{ ',tag=' ~ talos_proxmox_mgmt_vlan_id }}{% endif %}"
    ostype: l26
    scsihw: virtio-scsi-single
    onboot: yes
    agent: true
    state: present
    scsi: "{{
      ({ 'scsi0': talos_proxmox_proxmox_vm_storage ~ ':' ~ item.disk ~ ',format=raw' })
      | combine(
        ( { 'scsi1': talos_proxmox_proxmox_vm_storage ~ ':' ~ item.storage_disk ~ ',format=raw' } )
        if (item.storage_disk | default(0, true) | int) > 0 else {}
      )
    }}"
    ide:
      ide2: "{{ talos_proxmox_proxmox_storage }}:iso/talos-{{ talos_proxmox_talos_version }}-amd64.iso,media=cdrom"
  loop: "{{ talos_proxmox_masters + talos_proxmox_workers }}"
  loop_control:
    label: "{{ item.name }}"

- name: Wait for the VMs to be created
  ansible.builtin.wait_for:
    timeout: 20
  delegate_to: localhost

- name: Start talos VMs
  community.proxmox.proxmox_kvm:
    api_user: "{{ talos_proxmox_proxmox_api_user }}"
    api_host: "{{ talos_proxmox_proxmox_server }}"
    api_port: "{{ talos_proxmox_proxmox_port }}"
    api_token_id: "{{ talos_proxmox_proxmox_api_token_id }}"
    api_token_secret: "{{ talos_proxmox_proxmox_api_token_secret }}"
    node: "{{ talos_proxmox_proxmox_node }}"
    name: "{{ item.name }}"
    state: started
  loop: "{{ talos_proxmox_masters + talos_proxmox_workers }}"
  loop_control:
    label: "{{ item.name }}"

- name: Wait for the VMs to be fully started
  ansible.builtin.wait_for:
    timeout: 60
  delegate_to: localhost
