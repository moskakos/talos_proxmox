---
# Generate and distribute Talos configuration files

- name: Validate management network CIDR
  ansible.builtin.assert:
    that:
      - talos_proxmox_mgmt_network is string
      - "'/' in talos_proxmox_mgmt_network"
      - (talos_proxmox_mgmt_network | ansible.utils.ipv4('net')) is not false
    fail_msg: "Set talos_proxmox_mgmt_network to a valid IPv4 network in CIDR notation, for example 192.168.1.0/24."
    quiet: true

- name: Validate Talos API certificate SAN list
  ansible.builtin.assert:
    that:
      - talos_proxmox_talos_api_cert_sans | type_debug == 'list'
    fail_msg: "Set talos_proxmox_talos_api_cert_sans to a list of DNS names or IP address strings, or [] to disable it."
    quiet: true

- name: Validate Talos API certificate SAN entries
  ansible.builtin.assert:
    that:
      - item is string
      - item | trim | length > 0
      - item == item | trim
    fail_msg: "Each Talos API certificate SAN must be a non-empty DNS name or IP address string without surrounding whitespace."
    quiet: true
  loop: "{{ talos_proxmox_talos_api_cert_sans }}"

- name: Ensure private Talos configuration directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0700'
  loop:
    - "{{ talos_proxmox_workspace_environment.ansible_facts.ansible_env.HOME }}/.talos"
    - "{{ talos_proxmox_workspace_environment.ansible_facts.ansible_env.HOME }}/.talos/clusters"
    - "{{ talos_proxmox_talos_config_dir }}"

- name: Add cilium helm repo if cilium is to be installed
  ansible.builtin.command:
    cmd: helm repo add cilium https://helm.cilium.io/
  when: talos_proxmox_install_cilium

- name: Generate cilium values file
  ansible.builtin.template:
    src: cilium_values.yaml.j2
    dest: "{{ talos_proxmox_talos_config_dir }}/cilium_values.yaml"
    mode: '0600'
  when: talos_proxmox_install_cilium

- name: Generate cilium manifests
  ansible.builtin.command:
    argv:
      - helm
      - template
      - cilium
      - cilium/cilium
      - --version
      - "{{ talos_proxmox_cilium_version }}"
      - --namespace
      - kube-system
      - --values
      - "{{ talos_proxmox_talos_config_dir }}/cilium_values.yaml"
  when: talos_proxmox_install_cilium
  register: talos_proxmox_cilium_manifest

- name: Validate Talos extension list
  ansible.builtin.assert:
    that:
      - talos_proxmox_talos_extensions | type_debug == 'list'
    fail_msg: "Set talos_proxmox_talos_extensions to a list of official extension names, or [] for no additional extensions."
    quiet: true

- name: Validate Talos extension names
  ansible.builtin.assert:
    that:
      - item is string
      - item is match('^siderolabs/[a-z0-9][a-z0-9-]*$')
    fail_msg: "Use official Image Factory extension names such as siderolabs/iscsi-tools, without image tags or digests."
    quiet: true
  loop: "{{ talos_proxmox_talos_extensions }}"

- name: Create Talos ISO customization file
  ansible.builtin.template:
    src: talos_iso_customizations.yaml.j2
    dest: "{{ talos_proxmox_talos_config_dir }}/talos_iso_customizations.yaml"
    mode: '0600'

- name: Read Talos ISO customizations from the configuration host
  ansible.builtin.slurp:
    src: "{{ talos_proxmox_talos_config_dir }}/talos_iso_customizations.yaml"
  register: talos_proxmox_iso_customizations_file

- name: Get Talos ISO with customizations applied
  ansible.builtin.uri:
    url: "https://factory.talos.dev/schematics"
    method: POST
    body: "{{ talos_proxmox_iso_customizations_file.content | b64decode }}"
    status_code: 201
    headers:
      Content-Type: "application/x-yaml"
    return_content: yes
  register: talos_proxmox_talos_iso_response

- name: Set Talos ISO filename, download URL and Installer Image
  ansible.builtin.set_fact:
    talos_proxmox_talos_iso_filename: "talos-{{ talos_proxmox_talos_version }}-{{ talos_proxmox_talos_iso_response.json.id }}-amd64.iso"
    talos_proxmox_talos_installer_image_url: "factory.talos.dev/metal-installer/{{ talos_proxmox_talos_iso_response.json.id }}:{{ talos_proxmox_talos_version }}"
    talos_proxmox_talos_iso_download_url: "https://factory.talos.dev/image/{{ talos_proxmox_talos_iso_response.json.id }}/{{ talos_proxmox_talos_version }}/metal-amd64.iso"

- name: Create Talos config patch file
  ansible.builtin.template:
    src: talos_config_patch.yaml.j2
    dest: "{{ talos_proxmox_talos_config_dir }}/talos_config_patch.yaml"
    mode: '0600'

- name: Create talos node patch file
  ansible.builtin.template:
    src: talos_node_patch.yaml.j2
    dest: "{{ talos_proxmox_talos_config_dir }}/talos_node_patch_{{ talos_proxmox_node.name }}.yaml"
    mode: '0600'
  loop: "{{ talos_proxmox_masters + talos_proxmox_workers }}"
  loop_control:
    loop_var: talos_proxmox_node
    index_var: talos_proxmox_node_idx
    label: "{{ talos_proxmox_node.name }}"

- name: Generate talos secrets
  ansible.builtin.command:
    argv:
      - talosctl
      - gen
      - secrets
      - --output-file
      - "{{ talos_proxmox_talos_config_dir }}/talos_secrets.yaml"
  args:
    creates: "{{ talos_proxmox_talos_config_dir }}/talos_secrets.yaml"

- name: Protect the Talos secrets bundle
  ansible.builtin.file:
    path: "{{ talos_proxmox_talos_config_dir }}/talos_secrets.yaml"
    mode: '0600'

- name: Generate talos configuration files
  ansible.builtin.command:
    argv:
      - talosctl
      - gen
      - config
      - "{{ talos_proxmox_cluster_name }}"
      - "https://{{ talos_proxmox_cluster_name }}:6443"
      - --talos-version
      - "{{ talos_proxmox_talos_version }}"
      - --with-secrets
      - "{{ talos_proxmox_talos_config_dir }}/talos_secrets.yaml"
      - --output
      - "{{ talos_proxmox_talos_config_dir }}"
      - --config-patch
      - "@{{ talos_proxmox_talos_config_dir }}/talos_config_patch.yaml"
      - --force

- name: Protect generated Talos client and machine configurations
  ansible.builtin.file:
    path: "{{ talos_proxmox_talos_config_dir }}/{{ item }}"
    mode: '0600'
  loop:
    - controlplane.yaml
    - worker.yaml
    - talosconfig
