---
# Main task file for talos_proxmox role

- name: Check cluster API name resolution before installation
  ansible.builtin.import_tasks: check_cluster_dns.yml
  tags: [configure_talos, create_vms, install_talos, bootstrap_cluster, deploy_static_resources]

- name: Prepare persistent Talos configuration paths
  ansible.builtin.import_tasks: prepare_talos_workspace.yml
  tags: [configure_talos, install_talos, bootstrap_cluster]

- name: Prepare Kubernetes client connection settings
  ansible.builtin.import_tasks: prepare_kubernetes_connection.yml
  tags: [bootstrap_cluster, deploy_static_resources]

- name: Protect existing client configuration before bootstrap
  ansible.builtin.import_tasks: check_client_config.yml
  tags: [bootstrap_cluster]

- name: Validate minimum supported Talos version
  ansible.builtin.assert:
    that:
      - talos_proxmox_talos_version is version('v1.14.0', '>=')
    fail_msg: "Talos versions older than v1.14.0 are not supported. Set talos_proxmox_talos_version to v1.14.0 or later."
    quiet: true
  tags: [always]

- name: Generate and distribute Talos configuration
  ansible.builtin.import_tasks: configure_talos.yml
  tags: [configure_talos]

- name: Provision Talos VMs
  ansible.builtin.import_tasks: provision_vms.yml
  tags: [create_vms]

- name: Install Talos on provisioned VMs
  ansible.builtin.import_tasks: install_talos.yml
  tags: [install_talos]

- name: Bootstrap Talos Kubernetes cluster
  ansible.builtin.import_tasks: bootstrap_cluster.yml
  tags: [bootstrap_cluster]

- name: Deploy static resources
  ansible.builtin.import_tasks: deploy_static_resources.yml
  tags: [deploy_static_resources]
