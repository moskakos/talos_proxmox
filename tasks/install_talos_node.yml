---
# Loop file to install Talos on a single node

- name: Wait for the Talos API port on {{ item.name }}
  ansible.builtin.wait_for:
    host: "{{ talos_proxmox_talos_node_ips[item.name] }}"
    port: 50000
    state: started
    timeout: 300
    sleep: 10
    connect_timeout: 3
    msg: "Talos API port {{ talos_proxmox_talos_node_ips[item.name] }}:50000 for {{ item.name }} did not become reachable within 300 seconds."

- name: Apply Talos configuration to {{ item.name }}
  ansible.builtin.command:
    cmd: >-
      talosctl apply-config --insecure
      --nodes {{ talos_proxmox_talos_node_ips[item.name] | quote }}
      --file {{ (talos_proxmox_talos_config_dir ~ '/' ~ talos_proxmox_current_node_type ~ '.yaml') | quote }}
      --config-patch {{ ('@' ~ talos_proxmox_talos_config_dir ~ '/talos_node_patch_' ~ item.name ~ '.yaml') | quote }}
  changed_when: true

- name: Switch Proxmox interface to trunk port for {{ item.name }}
  community.proxmox.proxmox_nic:
    ca_path: "{{ talos_proxmox_proxmox_ca_path | default(omit, true) }}"
    api_user: "{{ talos_proxmox_proxmox_api_user }}"
    api_host: "{{ talos_proxmox_proxmox_server }}"
    api_port: "{{ talos_proxmox_proxmox_port }}"
    api_token_id: "{{ talos_proxmox_proxmox_api_token_id }}"
    api_token_secret: "{{ talos_proxmox_proxmox_api_token_secret }}"
    name: "{{ item.name }}"
    interface: net0
    bridge: "{{ talos_proxmox_k8s_vmbr }}"
    tag: false
  when: talos_proxmox_enable_vlans
