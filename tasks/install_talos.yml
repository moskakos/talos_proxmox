---
# Install Talos / Apply Talos configuration

- name: Discover each Talos node IPv4 address
  ansible.builtin.include_tasks: discover_talos_node_ip.yml
  loop: "{{ talos_proxmox_masters + talos_proxmox_workers }}"
  loop_control:
    loop_var: talos_proxmox_discovery_node
    label: "{{ talos_proxmox_discovery_node.name }}"

- name: Install Talos on master nodes
  ansible.builtin.include_tasks: install_talos_node.yml
  vars:
    talos_proxmox_current_node_type: "controlplane"
  loop: "{{ talos_proxmox_masters }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install Talos on worker nodes
  ansible.builtin.include_tasks: install_talos_node.yml
  vars:
    talos_proxmox_current_node_type: "worker"
  loop: "{{ talos_proxmox_workers }}"
  loop_control:
    label: "{{ item.name }}"
